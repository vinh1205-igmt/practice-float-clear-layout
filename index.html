<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-column">
            <h2>Nội dung chính</h2>
            <p>Cột bên trái chiếm 60% chiều rộng của container, dùng thuộc tính <code>float: left</code> để đẩy về bên trái.</p>
        </div>
        <div class="right-column">
            <h2>Sidebar</h2>
            <p>Cột bên phải chiếm 38% chiều rộng của container, dùng thuộc tính <code>float: right</code> để đẩy về bên phải.</p>
        </div>
    </div>

</body>
</html>
